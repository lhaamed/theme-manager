name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^11.0', '^12.0', '^13.0']
        exclude:
          - php: '8.2'
            laravel: '^13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          tools: composer:v2
      # Laravel 11 is retained only for backward-compatibility tests.
      # Keep this exception in the disposable runner, out of shipped composer.json.
      - name: Allow legacy framework in Laravel 11 compatibility jobs
        if: matrix.laravel == '^11.0'
        run: composer config --json policy.advisories.ignore '["laravel/framework"]'
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
