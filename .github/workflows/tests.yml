name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^11.0', '^12.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          tools: composer:v2
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
